version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [not_null, unique]

  - name: dim_product
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: dim_seller
    columns:
      - name: seller_id
        data_tests: [not_null, unique]

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [not_null, unique]

  - name: fct_order_items
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id
      - name: purchase_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                         'invoiced', 'processing', 'created', 'approved']

  - name: fct_payments
    columns:
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card']
              config:
                severity: warn